[project]
name = "ov-backend"
version = "0.1.0"
description = "Demo del motor de desbloqueos de orientación vocacional"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "google-genai>=2.26.0",
    "openpyxl>=3.1.5",
    "pydantic>=2,<3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
